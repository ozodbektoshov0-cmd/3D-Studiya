<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Studiya — ko’rish, tahrirlash, konvertatsiya</title>
<style>
:root{--bg:#eef1f4;--pn:#fff;--tx:#1a2230;--mt:#66727f;--ac:#0b6b5e;--ac2:#fff;--bd:#d3d9e0;--vp:#dfe5ea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0e1216;--pn:#171d24;--tx:#e5eaf0;--mt:#8995a3;--ac:#3fc9ae;--ac2:#06231d;--bd:#28313b;--vp:#0f1419;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 "Segoe UI",system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100%}

.btn,select,button{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:6px 11px;cursor:pointer}
.pri{background:var(--ac);color:var(--ac2);border-color:var(--ac);font-weight:600}

#prop .full{grid-column:1/3}
#st{display:block;margin-top:10px;color:var(--mt)}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:9;max-width:90%}
@media(max-width:760px){main{flex-direction:column}aside{width:auto;height:34%;border-left:0;border-top:1px solid var(--bd)}}

<script>
const $=s=>document.querySelector(s),vp=$('#vp'),cv=$('#c');
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)};
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,1,.01,5000);cam.position.set(4,3,5);
S.add(new THREE.HemisphereLight(0xffffff,0x445566,1.2));
const dl=new THREE.DirectionalLight(0xffffff,1.3);dl.position.set(5,10,7);S.add(dl);
S.add(new THREE.GridHelper(20,20,0x7f8c99,0x7f8c9955));
const ctl=new THREE.OrbitControls(cam,cv);ctl.enableDamping=true;
const tc=new THREE.TransformControls(cam,cv);S.add(tc);
tc.addEventListener('dragging-changed',e=>ctl.enabled=!e.value);
const root=new THREE.Group();S.add(root);let sel=null,wire=false,name='model';
new ResizeObserver(()=>{const r=vp.getBoundingClientRect();R.setSize(r.width,r.height,false);cam.aspect=r.width/r.height;cam.updateProjectionMatrix()}).observe(vp);
(function loop(){requestAnimationFrame(loop);ctl.update();R.render(S,cam)})();

/* ---- DFF (RenderWare) o’qish ---- */
function dff(b){
 const v=new DataView(b);
 const K=(p,e)=>{const r=[];while(p+12<=e){const s=v.getUint32(p+4,true);r.push([v.getUint32(p,true),p+12,s]);p+=12+s}return r};
 const str=(p,n)=>{let s='';for(let i=0;i<n&&v.getUint8(p+i);i++)s+=String.fromCharCode(v.getUint8(p+i));return s};
 const f4=p=>v.getFloat32(p,true);
 function G(d,e){
  let ver=v.getUint32(d-4,true);if(ver&0xFFFF0000)ver=((ver>>>14)&0x3FF00)+((ver>>>16)&0x3F)+0x30000;
  const ch=K(d,e);let q=ch[0][1];
  const fl=v.getUint32(q,true),nt=v.getUint32(q+4,true),nv=v.getUint32(q+8,true);q+=16;if(ver<0x34000)q+=12;
  if(fl&0x01000000)throw Error('PS2 native DFF qo’llanmaydi');
  const nu=((fl>>>16)&255)||(fl&4?1:fl&0x80?2:0);if(fl&8)q+=nv*4;
  const uv=nu?new Float32Array(nv*2):null;
  for(let k=0;k<nu;k++)for(let i=0;i<nv;i++,q+=8)if(!k){uv[i*2]=f4(q);uv[i*2+1]=1-f4(q+4)}
  const tri=[];
  for(let i=0;i<nt;i++,q+=8){const m=v.getUint16(q+4,true);(tri[m]=tri[m]||[]).push(v.getUint16(q+2,true),v.getUint16(q,true),v.getUint16(q+6,true))}
  q+=16;const hv=v.getUint32(q,true),hn=v.getUint32(q+4,true);q+=8;
  const pos=new Float32Array(nv*3),nor=hn?new Float32Array(nv*3):null;
  if(hv)for(let i=0;i<nv*3;i++)pos[i]=f4(q+i*4);q+=hv*nv*12;
  if(hn)for(let i=0;i<nv*3;i++)nor[i]=f4(q+i*4);
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  if(nor)g.setAttribute('normal',new THREE.BufferAttribute(nor,3));if(uv)g.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  let idx=[];tri.forEach((t,m)=>{if(t){g.addGroup(idx.length,t.length,m);idx=idx.concat(t)}});
  g.setIndex(idx);if(!nor)g.computeVertexNormals();
  const mats=[],ml=ch.find(c=>c[0]==8);
  if(ml)K(ml[1],ml[1]+ml[2]).filter(c=>c[0]==7).forEach(c=>{
   const x=c[1]+12,m=new THREE.MeshStandardMaterial({color:new THREE.Color(v.getUint8(x+4)/255,v.getUint8(x+5)/255,v.getUint8(x+6)/255),side:2});
   const tx=K(c[1],c[1]+c[2]).find(z=>z[0]==6);
   if(tx){const s=K(tx[1],tx[1]+tx[2]).find(z=>z[0]==2);if(s)m.name=m.userData.tex=str(s[1],s[2])}mats.push(m)});
  return[g,mats.length?mats:[new THREE.MeshStandardMaterial({color:0xb0b8c4,side:2})]];
 }
 const top=K(0,b.byteLength).find(c=>c[0]==0x10);if(!top)throw Error('Bu DFF fayl emas');
 const cl=K(top[1],top[1]+top[2]),fl=cl.find(c=>c[0]==0x0E),gl=cl.find(c=>c[0]==0x1A);
 const fch=K(fl[1],fl[1]+fl[2]),n=v.getUint32(fch[0][1],true),base=fch[0][1]+4;
 const names=fch.slice(1).map(c=>{const z=K(c[1],c[1]+c[2]).find(y=>y[0]==0x253F2FE);return z?str(z[1],z[2]):''});
 const F=[],par=[];
 for(let i=0;i<n;i++){const p=base+i*56,o=new THREE.Object3D(),r=j=>new THREE.Vector3(f4(p+j*12),f4(p+j*12+4),f4(p+j*12+8));
  o.name=names[i]||'frame'+i;o.applyMatrix4(new THREE.Matrix4().makeBasis(r(0),r(1),r(2)).setPosition(r(3)));F.push(o);par.push(v.getInt32(p+48,true))}
 const out=new THREE.Group();
 F.forEach((o,i)=>(par[i]>=0&&F[par[i]]?F[par[i]]:out).add(o));
 const geos=K(gl[1],gl[1]+gl[2]).filter(c=>c[0]==0xF).map(c=>G(c[1],c[1]+c[2]));
 cl.filter(c=>c[0]==0x14).forEach(c=>{const s=c[1]+12,fi=v.getUint32(s,true),gi=v.getUint32(s+4,true);
  if(F[fi]&&geos[gi]){const m=new THREE.Mesh(geos[gi][0],geos[gi][1]);m.name=F[fi].name+'_mesh';F[fi].add(m)}});
 out.rotation.x=-Math.PI/2;const w=new THREE.Group();w.add(out);return w;
}

/* ---- TXD o’qish ---- */
const tex={};
function applyTex(){meshes().forEach(o=>mats(o).forEach(m=>{const t=m.userData.tex&&tex[m.userData.tex.toLowerCase()];if(t&&m.map!==t){m.map=t;m.color.set(0xffffff);m.alphaTest=.05;m.needsUpdate=true}}))}
function txd(b){
 const v=new DataView(b),u8=p=>v.getUint8(p),u16=p=>v.getUint16(p,true),u32=p=>v.getUint32(p,true);
 const str=(p,n)=>{let s='';for(let i=0;i<n&&u8(p+i);i++)s+=String.fromCharCode(u8(p+i));return s};
 if(u32(0)!=0x16)throw Error('Bu TXD emas');
 function dxt(q,w,h,t,o){const bs=t==1?8:16,c5=c=>[(c>>11&31)*255/31,(c>>5&63)*255/63,(c&31)*255/31];
  for(let y0=0;y0<h;y0+=4)for(let x0=0;x0<w;x0+=4,q+=bs){
   const a=q+(t==1?0:8),c0=u16(a),c1=u16(a+2),A=c5(c0),B=c5(c1),pl=[A,B],bt=u32(a+4);
   if(c0>c1||t!=1)pl.push(A.map((x,i)=>(2*x+B[i])/3),A.map((x,i)=>(x+2*B[i])/3));else pl.push(A.map((x,i)=>(x+B[i])/2),[0,0,0]);
   const lo=t==5?u32(q+2):0,hi=t==5?u16(q+6):0,a0=u8(q),a1=u8(q+1);
   for(let i=0;i<16;i++){const x=x0+(i&3),y=y0+(i>>2);if(x>=w||y>=h)continue;
    const ci=bt>>>(2*i)&3,c=pl[ci],k=(y*w+x)*4;let al=255;
    if(t==1)al=c0<=c1&&ci==3?0:255;
    else if(t==3)al=(u8(q+(i>>1))>>(i&1)*4&15)*17;
    else{const s=i<10?lo>>>(3*i)&7:i==10?(lo>>>30|(hi&1)<<2)&7:hi>>>(3*i-32)&7;
     al=s==0?a0:s==1?a1:a0>a1?((8-s)*a0+(s-1)*a1)/7:s<6?((6-s)*a0+(s-1)*a1)/5:s==6?0:255}
    o[k]=c[0];o[k+1]=c[1];o[k+2]=c[2];o[k+3]=al}}}
 function nat(s){
  const plat=u32(s),name=str(s+8,32),rf=u32(s+72);let q=s+76,w,h,dep,d;
  if(plat==8){q+=4;w=u16(q);h=u16(q+2);dep=u8(q+4);d=u8(q+7);q+=8}
  else{const f=u32(q);q+=4;w=u16(q);h=u16(q+2);dep=u8(q+4);d=f==0x31545844?1:f==0x33545844?3:f==0x35545844?5:0;q+=8}
  const pal=rf&0x2000?q:0;if(pal)q+=1024;q+=4;
  const o=new Uint8ClampedArray(w*h*4);
  if(d)dxt(q,w,h,d,o);
  else for(let i=0;i<w*h;i++){let r,g,bl,a=255,k=i*4;
   if(pal){const x=u8(q+i)*4;bl=u8(pal+x);g=u8(pal+x+1);r=u8(pal+x+2);a=u8(pal+x+3)}
   else if(dep==32){bl=u8(q+k);g=u8(q+k+1);r=u8(q+k+2);a=u8(q+k+3)}
   else{const x=u16(q+i*2),f=rf&0xF00;if(f==0x200){r=(x>>11&31)*8.22;g=(x>>5&63)*4.05;bl=(x&31)*8.22}else if(f==0x300){a=(x>>12)*17;r=(x>>8&15)*17;g=(x>>4&15)*17;bl=(x&15)*17}else{a=x&0x8000?255:0;r=(x>>10&31)*8.22;g=(x>>5&31)*8.22;bl=(x&31)*8.22}}
   o[k]=r;o[k+1]=g;o[k+2]=bl;o[k+3]=(rf&0xF00)==0x600?255:a}
  const z=document.createElement('canvas');z.width=w;z.height=h;z.getContext('2d').putImageData(new ImageData(o,w,h),0,0);
  const t=new THREE.CanvasTexture(z);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.name=name;tex[name.toLowerCase()]=t}
 let p=12,n=0;const end=Math.min(b.byteLength,12+u32(4));
 while(p+12<=end){if(u32(p)==0x15){try{nat(p+24);n++}catch(e){}}p+=12+u32(p+4)}
 applyTex();toast(n+' ta tekstura yuklandi');
}

/* ---- DFF yozish (GTA SA, 0x1803FFFF) ---- */
function dffOut(){
 const VER=0x1803FFFF,U=a=>new Uint8Array(new Uint32Array(a).buffer),f=a=>new Uint8Array(new Float32Array(a).buffer),
  cat=a=>{let n=0;a.forEach(x=>n+=x.length);const o=new Uint8Array(n);let p=0;a.forEach(x=>{o.set(x,p);p+=x.length});return o},
  ck=(t,...a)=>{const d=cat(a);return cat([U([t,d.length,VER]),d])},
  s4=s=>{const o=new Uint8Array(Math.ceil((s.length+1)/4)*4);for(let i=0;i<s.length;i++)o[i]=s.charCodeAt(i);return o},E=()=>ck(3);
 root.updateMatrixWorld(true);const ms=meshes().filter(m=>m.visible),Z=new THREE.Matrix4().makeRotationX(Math.PI/2);
 const names=['root'],fr=[cat([f([1,0,0,0,1,0,0,0,1,0,0,0]),U([-1,0x20003])])];
 const geos=ms.map((m,mi)=>{
  names.push(m.name.replace(/_mesh$/,'')||'obj'+mi);
  const e=new THREE.Matrix4().multiplyMatrices(Z,m.matrixWorld).elements;
  fr.push(cat([f([e[0],e[1],e[2],e[4],e[5],e[6],e[8],e[9],e[10],e[12],e[13],e[14]]),U([0,0x20003])]));
  const g=m.geometry,P=g.getAttribute('position'),n=P.count;if(n>65535)throw Error(names[mi+1]+': 65535 ta uchdan ko’p');
  let N=g.getAttribute('normal');if(!N){const c=g.clone();c.computeVertexNormals();N=c.getAttribute('normal')}
  const UV=g.getAttribute('uv'),ix=g.index?g.index.array:null,nt=(ix?ix.length:n)/3,I=i=>ix?ix[i]:i;
  const gr=g.groups.length?g.groups:[{start:0,count:nt*3,materialIndex:0}],ma=[].concat(m.material),tris=[],bins=[];
  const pos=new Float32Array(n*3),nor=new Float32Array(n*3),uv=new Float32Array(n*2);
  for(let i=0;i<n;i++){pos.set([P.getX(i),P.getY(i),P.getZ(i)],i*3);nor.set([N.getX(i),N.getY(i),N.getZ(i)],i*3);if(UV)uv.set([UV.getX(i),1-UV.getY(i)],i*2)}
  let tn=0;gr.forEach(r=>{const k=Math.min(r.materialIndex||0,ma.length-1),bi=[];
   for(let i=r.start;i<Math.min(r.start+r.count,nt*3);i+=3){const a=I(i),b=I(i+1),c=I(i+2);tris.push(b,a,k,c);bi.push(a,b,c)}
   tn+=bi.length;bins.push([k,bi])});
  g.computeBoundingSphere();const bs=g.boundingSphere,fl=0x72|(UV?4|1<<16:0);
  const st=ck(1,U([fl,tris.length/4,n,1]),UV?f(uv):new Uint8Array(0),new Uint8Array(new Uint16Array(tris).buffer),f([bs.center.x,bs.center.y,bs.center.z,bs.radius]),U([1,1]),f(pos),f(nor));
  const ml=ck(8,ck(1,U([ma.length,...ma.map(()=>-1)])),...ma.map(x=>{const t=x.userData.tex||(x.map&&x.map.name)||'',c=x.color||{r:1,g:1,b:1};
   return ck(7,ck(1,U([0]),new Uint8Array([c.r*255,c.g*255,c.b*255,255]),U([0,t?1:0]),f([1,1,1])),...(t?[ck(6,ck(1,U([0x1106])),ck(2,s4(t)),ck(2,s4('')),E())]:[]),E())}));
  return ck(0xF,st,ml,ck(3,ck(0x50E,U([0,bins.length,tn]),...bins.map(([k,bi])=>cat([U([bi.length,k]),U(bi)])))));
 });
 const enc=new TextEncoder();
 return cat([ck(0x10,ck(1,U([ms.length,0,0])),
  ck(0xE,ck(1,U([fr.length]),...fr),...names.map(nm=>ck(3,ck(0x253F2FE,enc.encode(nm))))),
  ck(0x1A,ck(1,U([geos.length])),...geos),
  ...ms.map((m,i)=>ck(0x14,ck(1,U([i+1,i,5,0])),E())),E())]);
}

/* ---- yuklash ---- */
async function load(f){
 const ext=f.name.split('.').pop().toLowerCase(),buf=await f.arrayBuffer(),M=()=>new THREE.MeshStandardMaterial({color:0xb0b8c4,side:2});let o;
 if(ext=='glb'||ext=='gltf')o=await new Promise((ok,no)=>new THREE.GLTFLoader().parse(ext=='gltf'?new TextDecoder().decode(buf):buf,'',g=>ok(g.scene),no));
 else if(ext=='obj')o=new THREE.OBJLoader().parse(new TextDecoder().decode(buf));
 else if(ext=='stl')o=new THREE.Mesh(new THREE.STLLoader().parse(buf),M());
 else if(ext=='ply'){const g=new THREE.PLYLoader().parse(buf);g.computeVertexNormals();const m=M();m.vertexColors=!!g.getAttribute('color');o=new THREE.Mesh(g,m)}
 else if(ext=='dff')o=dff(buf);
 else if(ext=='txd'){txd(buf);return}
 else throw Error('“.'+ext+'” formati hozircha qo’llanmaydi (YTD/YFT/YDD hozircha yo’q)');
 o.name=f.name.replace(/\.[^.]+$/,'');name=o.name;root.add(o);$('#hint').style.display='none';refresh();fit(o);
}
async function loadAll(fs){for(const f of fs){try{await load(f)}catch(e){toast(f.name+': '+(e.message||e))}}}
$('#f').onchange=e=>{loadAll([...e.target.files]);e.target.value=''};
vp.ondragover=e=>{e.preventDefault();vp.classList.add('drag')};vp.ondragleave=()=>vp.classList.remove('drag');
vp.ondrop=e=>{e.preventDefault();vp.classList.remove('drag');loadAll([...e.dataTransfer.files])};

/* ---- tanlash va tahrirlash ---- */
const meshes=()=>{const a=[];root.traverse(o=>o.isMesh&&a.push(o));return a};
const mats=o=>[].concat(o.material||[]);
function select(o){sel=o;o?tc.attach(o):tc.detach();$('#prop').hidden=!o;
 if(o){$('#nm').value=o.name;const m=mats(o)[0];if(m&&m.color)$('#col').value='#'+m.color.getHexString()}refresh()}
function refresh(){applyTex();
 const L=$('#list');L.textContent='';const ms=meshes();let t=0;
 ms.forEach((m,i)=>{const g=m.geometry,c=g.index?g.index.count:g.getAttribute('position').count;t+=c/3;
  const b=document.createElement('button');b.textContent=m.name||'mesh '+(i+1);if(m==sel)b.className='on';b.onclick=()=>select(m);L.append(b)});
 $('#st').textContent=ms.length?ms.length+' ta mesh · '+Math.round(t).toLocaleString()+' uchburchak':'Model ochilmagan.';
}
function fit(o){const b=new THREE.Box3().setFromObject(o||root);if(b.isEmpty())return;
 const c=b.getCenter(new THREE.Vector3()),d=b.getSize(new THREE.Vector3()).length()||1;
 ctl.target.copy(c);cam.position.copy(c).add(new THREE.Vector3(.8,.6,1).normalize().multiplyScalar(d*1.3));cam.near=d/500;cam.far=d*50;cam.updateProjectionMatrix()}
$('#fit').onclick=()=>fit();
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{tc.setMode(b.dataset.m);document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x==b))});
$('#wf').onclick=e=>{wire=!wire;e.target.classList.toggle('on',wire);meshes().forEach(m=>mats(m).forEach(x=>x.wireframe=wire))};
$('#nm').oninput=e=>{if(sel){sel.name=e.target.value;refresh()}};
$('#col').oninput=e=>{if(sel)mats(sel).forEach(m=>m.color&&m.color.set(e.target.value))};
$('#vis').onclick=()=>{if(sel)sel.visible=!sel.visible};
$('#del').onclick=()=>{if(sel){const o=sel;select(null);o.parent.remove(o);refresh()}};
let dn=null;cv.addEventListener('pointerdown',e=>dn=[e.clientX,e.clientY]);
cv.addEventListener('pointerup',e=>{if(!dn||tc.axis||Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>5)return;
 const r=cv.getBoundingClientRect(),rc=new THREE.Raycaster();rc.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),cam);
 const h=rc.intersectObjects(root.children,true).find(x=>x.object.isMesh&&x.object.visible);select(h?h.object:null)});
addEventListener('keydown',e=>{if(/INPUT/.test(e.target.tagName))return;const k=e.key.toLowerCase();
 const m={w:'translate',e:'rotate',r:'scale'}[k];if(m)document.querySelector('[data-m='+m+']').click();if(k=='delete')$('#del').click()});

/* ---- eksport ---- */
$('#ex').onclick=()=>{
 if(!meshes().length)return toast('Avval model oching');
 const fmt=$('#fmt').value,r0=root.rotation.x;tc.detach();
 root.rotation.x=$('#zup').checked&&fmt!='dff'?Math.PI/2:0;root.updateMatrixWorld(true);
 const done=(d,mime)=>{root.rotation.x=r0;root.updateMatrixWorld(true);if(sel)tc.attach(sel);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:mime}));a.download=name+'.'+fmt;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5e3);toast(fmt.toUpperCase()+' tayyor')};
 const fail=e=>{root.rotation.x=r0;toast('Xato: '+(e.message||e))};
 try{
  if(fmt=='glb'||fmt=='gltf'){const x=new THREE.GLTFExporter(),o={binary:fmt=='glb'},cb=r=>done(fmt=='glb'?r:JSON.stringify(r),'model/gltf');
   x.parse.length>3?x.parse(root,cb,fail,o):x.parse(root,cb,o)}
  else if(fmt=='dff')done(dffOut(),'application/octet-stream');
  else if(fmt=='obj')done(new THREE.OBJExporter().parse(root),'text/plain');
  else if(fmt=='stl')done(new THREE.STLExporter().parse(root,{binary:true}),'model/stl');
  else new THREE.PLYExporter().parse(root,r=>done(r,'application/octet-stream'),{binary:true});
 }catch(e){fail(e)}
};
</script></body></html>
